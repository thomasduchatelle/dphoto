name: Feature CI
on:
  push:
    branches-ignore:
      - next
      - main
      - actions
      - update-snapshots

jobs:
  pull-request:
    uses: ./.github/workflows/job-pull-request.yml
    secrets: inherit

  test-go:
    uses: ./.github/workflows/job-test-go.yml
    secrets: inherit
  test-nextjs:
    uses: ./.github/workflows/job-test-nextjs.yml
    with:
      update-snapshots: ${{ contains(github.event.head_commit.message, '+update-snapshots') }}
  test-cdk:
    uses: ./.github/workflows/job-test-cdk.yml
    with:
      cache-suffix: ${{ github.run_number }}

  build-go:
    uses: ./.github/workflows/job-build-go.yml
    with:
      snapshot: "true"
  build-nextjs:
    uses: ./.github/workflows/job-build-nextjs.yml

  cdk-live-plan:
    uses: ./.github/workflows/job-comment-cdk-diff.yml
    if: needs.pull-request.outputs.pr-number != ''
    needs:
      - pull-request
      - build-go
    secrets: inherit
    with:
      issue-number: ${{ needs.pull-request.outputs.pr-number }}

  deploy-next:
    uses: ./.github/workflows/job-deploy.yml
    if: ${{ contains(github.event.head_commit.message, '+next') }}
    needs:
      - test-go
      - test-nextjs
      - test-cdk
      - build-go
      - build-nextjs
    secrets: inherit
    with:
      target: next
